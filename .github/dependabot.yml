version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors are migrated deliberately: @types/node tracks the Node 22 runtime.
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
      - { dependency-name: eslint, update-types: ["version-update:semver-major"] }
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
  - package-ecosystem: docker
    directories: [/infrastructure/docker]
    schedule: { interval: weekly }
    ignore:
      - { dependency-name: node, update-types: ["version-update:semver-major"] }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Stateful services: major upgrades need a data migration plan.
      - { dependency-name: postgres, update-types: ["version-update:semver-major"] }
      - { dependency-name: redis, update-types: ["version-update:semver-major"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
