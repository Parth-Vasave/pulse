name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python dependencies (pip-audit)
        run: pip install pip-audit && pip-audit --require-hashes -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Node dependencies (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus config and alert rules (promtool)
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/infrastructure/monitoring:/etc/prometheus:ro"
          prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
      - name: Validate the production compose file
        run: cp .env.example .env && DOMAIN=pulse.example.com docker compose -f docker-compose.prod.yml config -q

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: monitor, POSTGRES_PASSWORD: ci_password, POSTGRES_DB: monitor_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitor" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://monitor:ci_password@localhost:5432/monitor_test
      REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+psycopg://monitor:ci_password@localhost:5432/monitor_test
      PYTHONPATH: backend:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check . ../worker && ruff format --check . ../worker
      - name: Type-check
        working-directory: backend
        run: MYPYPATH=.:.. mypy app ../worker
      - name: Migrations apply and roll back cleanly
        working-directory: backend
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        working-directory: backend
        run: pytest --cov=app --cov=../worker --cov-report=term-missing:skip-covered --cov-fail-under=88 -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, file: infrastructure/docker/backend.Dockerfile }
          - { name: frontend, file: infrastructure/docker/frontend.Dockerfile }
          - { name: demo, file: infrastructure/docker/demo.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: pulse-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pulse-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait backend frontend worker scheduler demo-service
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser end-to-end test
        working-directory: frontend
        env: { E2E_TARGET_URL: "http://demo-service:9000", E2E_CONTROL_URL: "http://localhost:9000" }
        run: npx playwright test
      - if: failure()
        run: docker compose logs --tail=200
