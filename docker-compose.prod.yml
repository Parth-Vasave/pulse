# Production-style stack that runs the published images (see docs/DEPLOYMENT.md).
#   PULSE_VERSION=1.0.0 PULSE_REGISTRY=ghcr.io/parth-vasave docker compose -f docker-compose.prod.yml up -d
# Caddy is the only public entry point: it terminates TLS for $DOMAIN and proxies to the frontend, which
# forwards /api to the backend. The app ports are bound to 127.0.0.1 so nothing can bypass Caddy.
name: pulse

x-backend: &backend
  image: ${PULSE_REGISTRY:-ghcr.io/parth-vasave}/pulse-backend:${PULSE_VERSION:-latest}
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-monitor}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  backend:
    <<: *backend
    environment:
      # Required: the API's peer is always the frontend container, so without this every visitor would share one
      # rate-limit bucket. Safe only because every request arrives through Caddy, which overwrites X-Forwarded-For.
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8000:8000"]  # host-only: for a local Prometheus scrape or debugging, never public
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    working_dir: /app
    command: ["celery", "-A", "worker.celery_app", "worker", "-P", "threads", "-c", "20", "-Q", "checks,notifications", "-l", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  scheduler:
    <<: *backend
    working_dir: /app
    command: ["celery", "-A", "worker.celery_app", "beat", "-l", "INFO", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  frontend:
    image: ${PULSE_REGISTRY:-ghcr.io/parth-vasave}/pulse-frontend:${PULSE_VERSION:-latest}
    environment:
      INTERNAL_API_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]  # host-only: public traffic goes through Caddy
    depends_on: [backend]
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine
    # Automatic HTTPS for $DOMAIN (Let's Encrypt). X-Forwarded-For is SET, not appended, to the address Caddy
    # actually saw, so a client-supplied header can never reach the API's rate limiter.
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${DOMAIN:?set DOMAIN in .env}
      - --to
      - frontend:3000
      - --header-up
      - "X-Forwarded-For: {http.request.remote.host}"
      - --header-down
      - "Strict-Transport-Security: max-age=31536000"
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddydata:/data]
    depends_on: [frontend]
    restart: unless-stopped

  backup:
    image: postgres:16-alpine  # same major version as the server, so pg_dump matches it
    # Dumps the database to ./backups on the host every BACKUP_INTERVAL_SECONDS (default daily) and keeps
    # BACKUP_KEEP_DAYS of them. Copy that directory off the host too; see docs/DEPLOYMENT.md#backups.
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-monitor}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-monitor}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          f=/backups/pulse-$$(date -u +%Y%m%dT%H%M%SZ).dump
          # Write to .partial and rename, so a failed or interrupted dump never looks like a good one.
          if pg_dump --format=custom --file="$$f.partial" && mv "$$f.partial" "$$f"; then
            echo "backup_ok file=$$f size=$$(du -h "$$f" | cut -f1)"
            # Prune only after a success: if dumps keep failing, the last good ones are kept.
            find /backups -name 'pulse-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          else
            rm -f "$$f.partial"
            echo "backup_failed" >&2
          fi
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    volumes: ["./backups:/backups"]
    healthcheck:
      # Unhealthy once the newest good dump is older than two intervals.
      test: ["CMD-SHELL", "find /backups -name 'pulse-*.dump' -mmin -$$((BACKUP_INTERVAL_SECONDS * 2 / 60 + 1)) | grep -q ."]
      interval: 5m
      start_period: 10m
    depends_on:
      migrate: { condition: service_completed_successfully }  # never dump a half-migrated schema
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:  # TLS certificates and keys; keep it so restarts don't re-issue
